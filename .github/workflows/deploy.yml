name: Deploy to DatHost via FTP

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE'
      - 'assets/**'
      - 'agent-plans/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview files and FTP actions without uploading or modifying the server'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dathost-ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload managed server files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate FTP configuration
        id: config
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
          FTP_FORCE_TLS: ${{ vars.FTP_FORCE_TLS }}
          FTP_VERIFY_TLS: ${{ vars.FTP_VERIFY_TLS }}
          FTP_DRY_RUN: ${{ vars.FTP_DRY_RUN }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          missing=0
          for var in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          port="${FTP_PORT:-21}"
          if ! [[ "$port" =~ ^[0-9]+$ ]]; then
            echo "::error::FTP_PORT must be a numeric port (default: 21)."
            exit 1
          fi

          remote_dir="${FTP_REMOTE_DIR:-/}"
          case "$remote_dir" in
            *"'"*|*'"'*|*';'*)
              echo "::error::FTP_REMOTE_DIR contains unsupported quote or semicolon characters."
              exit 1
              ;;
          esac

          dry_run="false"
          if [ "${INPUT_DRY_RUN:-false}" = "true" ] || [ "${FTP_DRY_RUN:-false}" = "true" ]; then
            dry_run="true"
          fi

          echo "port=$port" >> "$GITHUB_OUTPUT"
          echo "remote_dir=$remote_dir" >> "$GITHUB_OUTPUT"
          echo "force_tls=${FTP_FORCE_TLS:-true}" >> "$GITHUB_OUTPUT"
          echo "verify_tls=${FTP_VERIFY_TLS:-true}" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

      - name: Stage managed server files
        id: stage
        env:
          DRY_RUN: ${{ steps.config.outputs.dry_run }}
          REMOTE_DIR: ${{ steps.config.outputs.remote_dir }}
        run: |
          set -euo pipefail

          staging_dir="$RUNNER_TEMP/deploy-staging"
          rm -rf "$staging_dir"
          mkdir -p "$staging_dir"

          # Copy only repo-managed server files. Repo metadata, worlds, jars,
          # logs, databases, secrets, and live runtime state are excluded.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.idea/' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='README.md' \
            --exclude='AGENTS.md' \
            --exclude='LICENSE' \
            --exclude='/assets/' \
            --exclude='/agent-plans/' \
            --exclude='/custom-plugins/' \
            --exclude='/world/' \
            --exclude='/world_nether/' \
            --exclude='/world_the_end/' \
            --exclude='/world_*/' \
            --exclude='/spawn/' \
            --exclude='/logs/' \
            --exclude='/crash-reports/' \
            --exclude='/cache/' \
            --exclude='/bundler/' \
            --exclude='/libraries/' \
            --exclude='/versions/' \
            --exclude='/data-storage/' \
            --exclude='/plugins/.paper-remapped/' \
            --exclude='server.properties' \
            --exclude='eula.txt' \
            --exclude='ops.json' \
            --exclude='whitelist.json' \
            --exclude='banned-ips.json' \
            --exclude='banned-players.json' \
            --exclude='usercache.json' \
            --exclude='usernamecache.json' \
            --exclude='version_history.json' \
            --exclude='*.jar' \
            --exclude='*.war' \
            --exclude='*.zip' \
            --exclude='*.tar.gz' \
            --exclude='*.rar' \
            --exclude='*.db' \
            --exclude='*.db-journal' \
            --exclude='*.db-wal' \
            --exclude='*.db-shm' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite3' \
            --exclude='*.mv.db' \
            --exclude='*.trace.db' \
            --exclude='*.h2.db' \
            --exclude='*.secret' \
            --exclude='*.key' \
            --exclude='*.pem' \
            --exclude='*.p12' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.mca' \
            --exclude='*.mcc' \
            --exclude='*.log' \
            --exclude='*.log.gz' \
            --exclude='*.bak' \
            --exclude='session.lock' \
            --exclude='uid.dat' \
            --exclude='level.dat' \
            --exclude='level.dat_old' \
            --exclude='/plugins/Citizens/saves.yml' \
            --exclude='/plugins/Citizens/shops.yml' \
            --exclude='/plugins/Denizen/maps.yml' \
            --exclude='/plugins/Denizen/scoreboards.yml' \
            --exclude='/plugins/Denizen/secrets.secret' \
            --exclude='/plugins/Denizen/server_flags.dat' \
            --exclude='/plugins/Jobs/Signs.yml' \
            --exclude='/plugins/PlayerWarps/favorites.yml' \
            --exclude='/plugins/PlayerWarps/warps.yml' \
            ./ "$staging_dir/"

          find "$staging_dir" -type d -empty -delete

          file_count="$(find "$staging_dir" -type f | wc -l | tr -d ' ')"
          if [ "$file_count" -eq 0 ]; then
            echo "::error::No deployable files were staged. Aborting."
            exit 1
          fi

          # Defense-in-depth check: fail before connecting if any sensitive or
          # unmanaged file pattern is present in the staging directory.
          forbidden="$(find "$staging_dir" -type f \( \
            -name 'server.properties' -o \
            -name 'ops.json' -o \
            -name 'whitelist.json' -o \
            -name 'banned-*.json' -o \
            -name 'eula.txt' -o \
            -name '*.jar' -o \
            -name '*.db' -o \
            -name '*.sqlite' -o \
            -name '*.sqlite3' -o \
            -name '*.mv.db' -o \
            -name '*.h2.db' -o \
            -name '*.secret' -o \
            -name '*.key' -o \
            -name '*.pem' -o \
            -name '.env' -o \
            -name '.env.*' \
          \))"
          if [ -n "$forbidden" ]; then
            echo "::error::Forbidden files detected in staging directory:"
            echo "$forbidden"
            exit 1
          fi

          echo "staging_dir=$staging_dir" >> "$GITHUB_OUTPUT"
          echo "file_count=$file_count" >> "$GITHUB_OUTPUT"

          {
            echo "### DatHost FTP Deployment Summary"
            if [ "$DRY_RUN" = "true" ]; then
              echo "- **Mode:** Dry run (no remote changes)"
            else
              echo "- **Mode:** Live upload (additive, no remote deletes)"
            fi
            echo "- **Staged files:** $file_count"
            echo "- **Remote target:** \`$REMOTE_DIR\`"
            echo ""
            echo "<details><summary>Top-level staged paths</summary>"
            echo ""
            (cd "$staging_dir" && find . -mindepth 1 -maxdepth 2 | sort | sed 's|^\./|- `|; s|$|`|')
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Upload staged files to DatHost
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ steps.config.outputs.port }}
          FTP_REMOTE_DIR: ${{ steps.config.outputs.remote_dir }}
          FTP_FORCE_TLS: ${{ steps.config.outputs.force_tls }}
          FTP_VERIFY_TLS: ${{ steps.config.outputs.verify_tls }}
          DRY_RUN: ${{ steps.config.outputs.dry_run }}
          STAGING_DIR: ${{ steps.stage.outputs.staging_dir }}
        run: |
          set -euo pipefail

          # Normalize FTP_SERVER in case whitespace, a scheme, or a trailing slash was entered.
          host="$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]')"
          host="${host#ftp://}"
          host="${host#ftps://}"
          host="${host%/}"

          ssl_force="true"
          ssl_protect_data="true"
          if [ "$FTP_FORCE_TLS" = "false" ]; then
            ssl_force="false"
            ssl_protect_data="false"
          fi

          ssl_verify="yes"
          if [ "$FTP_VERIFY_TLS" = "false" ]; then
            ssl_verify="no"
          fi

          trap 'rm -f "$HOME/.lftprc"' EXIT
          umask 077
          cat > "$HOME/.lftprc" <<EOF
          set cmd:fail-exit true
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:timeout 30
          set ftp:passive-mode true
          set ftp:ssl-allow true
          set ftp:ssl-force ${ssl_force}
          set ftp:ssl-protect-data ${ssl_protect_data}
          set ssl:verify-certificate ${ssl_verify}
          EOF

          # Upload-only reverse mirror: --delete is intentionally omitted so
          # unmanaged files on DatHost (worlds, jars, databases, player data)
          # are never deleted.
          mirror_opts="--reverse --continue --verbose --no-perms --no-umask --parallel=4"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Running in DRY RUN mode: no files will be uploaded or modified."
            mirror_opts="${mirror_opts} --dry-run"
          fi

          lftp --env-password \
            -u "$FTP_USERNAME" \
            -p "$FTP_PORT" \
            "ftp://${host}" \
            -e "mirror ${mirror_opts} '${STAGING_DIR}' '${FTP_REMOTE_DIR}'; quit"
