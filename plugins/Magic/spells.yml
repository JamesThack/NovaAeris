# Disintegrate is the high-impact Fighting unlock, limited by its long cooldown.
disintegrate:
  parameters:
    range: 24
    player_damage: 30
    entity_damage: 50
    cooldown: 120000
  costs:
    mana: 100

  actions:
    cast:
    - class: CustomProjectile
      actions:
      - class: Damage
      - class: PlayEffects
        effects: removed
        ignore_result: true
      - class: ModifyBlock
        ignore_result: true

# Buff every Fishing Stream rank modestly while preserving its damage curve.
stream:
  parameters:
    player_damage: 0.35
    entity_damage: 0.65

stream|2:
  parameters:
    player_damage: 0.6
    entity_damage: 0.9

stream|3:
  parameters:
    player_damage: 0.85
    entity_damage: 1.15

stream|4:
  parameters:
    player_damage: 1.1
    entity_damage: 1.4
    range: 40
    undo_to: 6

  actions:
    cast:
    - class: DisablePhysics
      ignore_result: true
    - class: CustomProjectile
      tick:
      - class: ModifyBlock
        ignore_result: true
      - class: Undo
        ignore_result: true
      - class: AreaOfEffect
        actions:
        - class: Damage
        - class: Velocity

# Sorcery rewards: extend Horse duration and provide the second Pull rank.
horse:
  parameters:
    undo: 300000

  actions:
    cast:
    - class: ChangeContext
      target_offset: 0,1,0
      ignore_result: true
      actions:
      - class: Plane
        radius: 1
        actions:
        - class: CheckBlock
          allowed: passthrough
          fail:
          - class: Message
            ignore_result: true
            message_type: action_bar
            message_key: nospace
          - class: CastResult
            result: no_target
            end_result: true
          - class: Stop
    - class: SpawnEntity
    - class: Mount
    - class: PlayEffects
      effects: spawned

pull|2:
  parameters:
    range: 64
    living_entity_speed: 1.25
    item_speed: 2.5
    cooldown: 3000
  costs:
    mana: 15

  actions:
    cast:
    - class: Velocity
    - class: FallProtection
    alternate_down:
    - class: ChangeContext
      target_caster: true
      actions:
      - class: Repeat
        repeat: 2
        actions:
        - class: AreaOfEffect
          radius: 12
          actions:
          - class: Velocity
            push: -1
            living_entity_speed: 1
          - class: FallProtection
          - class: Delay
            delay: 200

