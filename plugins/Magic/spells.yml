# Blast is slightly stronger at its initial Excavation unlock; the level 84
# upgrade increases its radius and block-breaking power further.
blast:
  parameters:
    radius: 1.5
    destructible_durability: 100
    break_durability: 20
    durability_max_distance: 4
    damage_max_distance: 3
    damage: 4

blast|2:
  parameters:
    radius: 2.5
    destructible_durability: 250
    break_durability: 60
    durability_max_distance: 5
    damage_max_distance: 4
    damage: 6
    undo: 20000

# Railgun is unlocked at Archery 85 at level 1; higher versions are disabled.
railgun:
  enabled: true
  parameters:
    player_damage: 23
    entity_damage: 23
    cooldown: 25000
  headshot_parameters:
    player_damage: 31
    entity_damage: 31
    damage_multiplier: 1

railgun|2:
  enabled: false

railgun|3:
  enabled: false
