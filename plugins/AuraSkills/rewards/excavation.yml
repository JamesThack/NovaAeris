patterns:
  - type: stat
    stat: strength
    value: 1
    pattern:
      interval: 2
levels:
  5:
    - type: command
      executor: console
      command: 'mage add {player} sandblast'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Sandblast</bold><gray>: A spell to launch sand with magic'
  20:
    - type: command
      executor: console
      command: 'mage add {player} sandblast|2'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Sandblast</bold><gray>: More effectiveness'
  40:
    - type: command
      executor: console
      command: 'mage add {player} blast'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Blast</bold><gray>: A spell to blast weaker blocks'
  60:
    - type: command
      executor: console
      command: 'mage add {player} collapse'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Collapse</bold><gray>: A spell to collapse blocks with magic'
  80:
    - type: command
      executor: console
      command: 'mage add {player} collapse|2'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Collapse</bold><gray>: More effectiveness'
  84:
    - type: command
      executor: console
      command: 'mage add {player} blast|2'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Blast</bold><gray>: More effectiveness'
