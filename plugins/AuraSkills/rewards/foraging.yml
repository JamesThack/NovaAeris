patterns:
  - type: stat
    stat: strength
    value: 1
    pattern:
      interval: 1
  - type: stat
    stat: toughness
    value: 1
    pattern:
      interval: 2
levels:
  5:
    - type: command
      executor: console
      command: 'mage add {player} chop'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Chop</bold><gray>: A spell to cut down trees with magic'
  20:
    - type: command
      executor: console
      command: 'mage add {player} chop|2'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Chop</bold><gray>: More effectiveness'
  40:
    - type: command
      executor: console
      command: 'mage add {player} chop|3'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Chop</bold><gray>: More effectiveness'
  60:
    - type: command
      executor: console
      command: 'mage add {player} chop|4'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Chop</bold><gray>: More effectiveness'
  80:
    - type: command
      executor: console
      command: 'mage add {player} chop|5'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Chop</bold><gray>: More effectiveness'
