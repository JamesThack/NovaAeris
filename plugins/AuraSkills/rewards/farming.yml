patterns:
  - type: stat
    stat: health
    value: 0.4
    pattern:
      interval: 1
  - type: stat
    stat: strength
    value: 1
    pattern:
      interval: 2
levels:
  5:
    - type: command
      executor: console
      command: 'mage add {player} growth'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Growth</bold><gray>: A spell to make crops grow magically'
  20:
    - type: command
      executor: console
      command: 'mage add {player} growth|2'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Growth</bold><gray>: More effectiveness'
  40:
    - type: command
      executor: console
      command: 'mage add {player} growth|3'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Growth</bold><gray>: More effectiveness'
  60:
    - type: command
      executor: console
      command: 'mage add {player} growth|4'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Growth</bold><gray>: More effectiveness'
  80:
    - type: command
      executor: console
      command: 'mage add {player} growth|5'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Growth</bold><gray>: More effectiveness'
