patterns:
  - type: stat
    stat: toughness
    value: 1
    pattern:
      interval: 1
  - type: stat
    stat: health
    value: 0.4
    pattern:
      interval: 2
levels:
  5:
    - type: command
      executor: console
      command: 'mage add {player} invincible'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Invincible I</bold><gray>: Briefly become impervious to damage'
  25:
    - type: command
      executor: console
      command: 'mage add {player} shell'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Shell</bold><gray>: Unlock the Shell spell'
  30:
    - type: command
      executor: console
      command: 'mage add {player} invincible|2'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Invincible II</bold><gray>: 10 seconds of protection without slowing down'
  45:
    - type: command
      executor: console
      command: 'mage add {player} walls'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Walls</bold><gray>: Unlock the Walls spell'
  80:
    - type: command
      executor: console
      command: 'mage add {player} invincible|3'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Invincible III</bold><gray>: 10 seconds of protection and invisibility'
