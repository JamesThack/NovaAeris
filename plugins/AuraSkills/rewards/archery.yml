patterns:
  - type: stat
    stat: crit_chance
    value: 1
    pattern:
      interval: 1
  - type: stat
    stat: strength
    value: 1
    pattern:
      interval: 2
levels:
  3:
    - type: command
      executor: console
      command: 'mage add {player} arrow'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Arrow I</bold><gray>: Unlock the Arrow spell'
  10:
    - type: command
      executor: console
      command: 'mage add {player} homing'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Homing Missile I</bold><gray>: Unlock a missile that tracks its target'
  15:
    - type: command
      executor: console
      command: 'mage add {player} arrow|2'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Arrow II</bold><gray>: Upgrade the Arrow spell'
