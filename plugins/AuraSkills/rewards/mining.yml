patterns:
  - type: stat
    stat: toughness
    value: 1
    pattern:
      interval: 1
  - type: stat
    stat: luck
    value: 1
    pattern:
      interval: 2
levels:
  5:
    - type: command
      executor: console
      command: 'mage add {player} mine'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Mine</bold><gray>: A spell to mine ores with magic'
  20:
    - type: command
      executor: console
      command: 'mage add {player} mine|2'
      menu_message: '\n  <dark_aqua>✦ <bold><aqua>Mine</bold><gray>: More effectiveness'
  40:
    - type: command
      executor: console
      command: 'mage add {player} mine|3'
